name: Tests
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier que index.html est à jour
        run: |
          npm run build
          git diff --exit-code index.html || { echo "::error::index.html n'est pas à jour : lancer « npm run build » puis versionner index.html."; exit 1; }
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
